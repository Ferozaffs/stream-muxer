<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none" role="img" aria-label="stream-muxer logo">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06351A"/>
      <stop offset="1" stop-color="#041209"/>
    </linearGradient>
  </defs>

  <!-- mux screen (the logo mark) -->
  <rect x="44" y="64" width="112" height="116" rx="14" fill="url(#screen)" stroke="#0AA84C" stroke-width="2"/>
  <!-- scanlines -->
  <g stroke="#0B5A2A" stroke-width="1" opacity="0.9">
    <path d="M52 80 H148"/><path d="M52 100 H148"/><path d="M52 120 H148"/><path d="M52 140 H148"/><path d="M52 160 H148"/><path d="M52 180 H148"/>
  </g>
  <!-- falling code -->
  <g fill="#1F8A4A" opacity="0.9">
    <rect x="136" y="74"  width="5" height="6"/><rect x="136" y="96" width="5" height="6"/>
    <rect x="136" y="122" width="5" height="6"/><rect x="136" y="150" width="5" height="6"/>
  </g>
  <!-- three source lanes -> one output -->
  <path d="M62 88 H110" stroke="#1F9A4C" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M62 124 H110" stroke="#B9FFC9" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M62 156 H110" stroke="#1F9A4C" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <path d="M114 88 V156" stroke="#0AA84C" stroke-width="4" stroke-linecap="round"/>
  <rect x="106" y="118" width="14" height="12" rx="3" fill="#D9FFE0"/>
  <path d="M118 124 H152" stroke="#0AA84C" stroke-width="7" stroke-linecap="round"/>
  <path d="M140 114 L152 124 L140 134" stroke="#0AA84C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- wordmark -->
  <text x="196" y="138" font-family="'Cascadia Code','JetBrains Mono','Consolas','Menlo',monospace" font-size="66" font-weight="700" letter-spacing="-1" fill="#0AA84C" filter="url(#glow)">stream-muxer</text>
  <text x="198" y="184" font-family="'Cascadia Code','JetBrains Mono','Consolas','Menlo',monospace" font-size="22" font-weight="500" letter-spacing="5" fill="#137A3B">ZERO RE-ENCODING</text>
</svg>
