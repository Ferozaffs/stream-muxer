<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" fill="none" role="img" aria-label="stream-muxer logo">
  <defs>
    <linearGradient id="badge" x1="20" y1="40" x2="180" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="strokeWord" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#1F2937"/>
    </linearGradient>
  </defs>

  <rect x="20" y="40" width="170" height="170" rx="36" fill="url(#badge)"/>

  <!-- three inputs merging into one output -->
  <path d="M52 78 L116 110" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.95"/>
  <path d="M52 128 L116 128" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.78"/>
  <path d="M52 178 L116 146" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
  <path d="M134 128 L180 128" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M168 114 L186 128 L168 142" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- switch accent -->
  <circle cx="146" cy="112" r="9" fill="#FBBF24"/>

  <text x="230" y="138" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#strokeWord)">stream-muxer</text>
  <text x="233" y="186" font-family="ui-sans-serif, system-ui, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="4" fill="#6366F1">MULTIPLEX · FAILOVER · ZERO RE-ENCODING</text>
</svg>
